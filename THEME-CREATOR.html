<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier de thèmes TV</title>
<style>
:root{
  --ui-bg:#17191E; --ui-panel:#1F2228; --ui-raised:#282C34; --ui-line:#323741; --ui-line2:#3E4450;
  --ui-text:#E6E8EC; --ui-muted:#9198A5; --ui-dim:#6B7280;
  --ui-accent:#FFB547; --ui-accent-ink:#1A1408; --ui-err:#FF6B5E; --ui-warn:#F2C14E; --ui-info:#7FB2FF; --ui-ok:#5BC98A;
  --ui-font: system-ui, -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
  --ui-mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
  --ambient: 60,80,120;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ui-bg);color:var(--ui-text);font:13px/1.45 var(--ui-font)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ui-accent);outline-offset:1px}

/* ---------- barre du haut ---------- */
.top{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--ui-line);background:var(--ui-panel)}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:14px;letter-spacing:.1px;margin-right:6px;white-space:nowrap}
.brand .led{width:8px;height:8px;border-radius:50%;background:var(--ui-accent);box-shadow:0 0 8px var(--ui-accent)}
.top .name{color:var(--ui-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.top .grow{flex:1}
.btn{height:32px;padding:0 12px;border-radius:7px;border:1px solid var(--ui-line2);background:var(--ui-raised);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#566070}
.btn.primary{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--ui-accent-ink);font-weight:650}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ui-muted)}
.btn.ghost:hover{color:var(--ui-text);background:var(--ui-raised)}
.btn.small{height:26px;padding:0 9px;font-size:12px;border-radius:6px}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn:disabled{opacity:.4;cursor:default}
.menu{position:relative}
.menu-pop{position:absolute;top:36px;right:0;z-index:50;min-width:240px;background:var(--ui-raised);border:1px solid var(--ui-line2);border-radius:9px;padding:6px;display:none;box-shadow:0 12px 40px #0008}
.menu-pop.open{display:block}
.menu-pop button{display:block;width:100%;text-align:left;padding:8px 10px;border:0;background:none;border-radius:6px}
.menu-pop button:hover{background:#ffffff10}
.menu-pop small{display:block;color:var(--ui-muted);font-size:11.5px}
.menu-pop hr{border:0;border-top:1px solid var(--ui-line);margin:5px 2px}

/* ---------- mise en page ---------- */
.app{display:grid;grid-template-columns:150px 392px 1fr;height:calc(100% - 52px)}
.rail{border-right:1px solid var(--ui-line);padding:8px 6px;overflow:auto;background:var(--ui-panel)}
.rail button{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;border:0;background:none;padding:7px 9px;border-radius:6px;color:var(--ui-muted)}
.rail button:hover{color:var(--ui-text);background:#ffffff08}
.rail button.on{color:var(--ui-text);background:var(--ui-raised);box-shadow:inset 2px 0 0 var(--ui-accent)}
.rail .count{font-size:11px;color:var(--ui-dim)}
.rail .sep{height:1px;background:var(--ui-line);margin:6px 4px}
.panel{overflow:auto;border-right:1px solid var(--ui-line);padding:14px 16px 60px}
.panel h2{font-size:15px;margin:2px 0 4px;font-weight:650}
.panel .lead{color:var(--ui-muted);margin:0 0 14px;font-size:12.5px}
.panel h3{font-size:12.5px;font-weight:650;margin:18px 0 8px;color:var(--ui-text);display:flex;align-items:center;gap:8px}
.panel h3 .hint{font-weight:400;color:var(--ui-dim)}
.group{border:1px solid var(--ui-line);border-radius:9px;padding:10px;margin:8px 0;background:#ffffff03}
.group.sel{border-color:var(--ui-accent)}
.group-head{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.group-head .t{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.group-head .seg{flex:none;flex-wrap:nowrap}

/* champs */
.f{display:grid;grid-template-columns:108px 1fr 18px;align-items:center;gap:8px;margin:5px 0;min-height:28px}
.f>label{color:var(--ui-muted);font-size:12px;line-height:1.2}
.f.set>label{color:var(--ui-text)}
.f .reset{width:18px;height:18px;border:0;padding:0;background:none;color:var(--ui-dim);border-radius:4px;visibility:hidden;font-size:13px;line-height:1}
.f.set .reset{visibility:visible}
.f .reset:hover{color:var(--ui-err);background:#ffffff0c}
.f.wide{grid-template-columns:1fr 18px}
.f.wide>label{grid-column:1/-1}
.inp{height:28px;width:100%;min-width:0;padding:0 8px;border-radius:6px;border:1px solid var(--ui-line2);background:#14161A}
.inp:focus{border-color:var(--ui-accent);outline:none}
select.inp{padding:0 6px}
textarea.inp{height:auto;padding:7px 8px;font-family:var(--ui-mono);font-size:11.5px;line-height:1.5;resize:vertical;tab-size:4;white-space:pre}
.row{display:flex;gap:6px;align-items:center;min-width:0}
.row>*{min-width:0}
.num{display:flex;gap:6px;align-items:center}
.num input[type=range]{flex:1;accent-color:var(--ui-accent)}
.num .inp{width:66px;flex:none}
.unit{color:var(--ui-dim);font-size:11px;flex:none}
.colorf{display:flex;gap:6px;align-items:center;min-width:0}
.swatch{position:relative;width:28px;height:28px;flex:none;border-radius:6px;border:1px solid var(--ui-line2);overflow:hidden;background:repeating-conic-gradient(#888 0 25%,#ccc 0 50%) 0 0/10px 10px}
.swatch i{position:absolute;inset:0}
.swatch input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.alpha{width:42px;flex:none;accent-color:var(--ui-accent)}
.toggle{display:inline-flex;align-items:center;gap:7px;cursor:pointer;color:var(--ui-text)}
.toggle input{accent-color:var(--ui-accent);width:15px;height:15px}
.seg{display:inline-flex;border:1px solid var(--ui-line2);border-radius:7px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:none;padding:4px 9px;color:var(--ui-muted);font-size:12px}
.seg button.on{background:var(--ui-accent);color:var(--ui-accent-ink);font-weight:600}
.stops{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stops .stop{display:flex;align-items:center;gap:3px;background:#14161A;border:1px solid var(--ui-line2);border-radius:6px;padding:2px}
.stops .stop .swatch{width:22px;height:22px}
.stops .stop button{border:0;background:none;color:var(--ui-dim);padding:0 3px}
.err{color:var(--ui-err);font-family:var(--ui-mono);font-size:11px;white-space:pre-wrap;margin:6px 0}
.okmsg{color:var(--ui-ok);font-size:11.5px;margin:6px 0}
.note{color:var(--ui-muted);font-size:12px;margin:6px 0;line-height:1.45}
.note b{color:var(--ui-text);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px solid var(--ui-line2);background:var(--ui-raised);border-radius:999px;padding:4px 10px;font-size:12px}
.chipbtn:hover{border-color:var(--ui-accent)}
.lib{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lib button{aspect-ratio:1;border:1px solid var(--ui-line2);background:#14161A;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;font-size:10.5px;color:var(--ui-muted)}
.lib button:hover{border-color:var(--ui-accent);color:var(--ui-text)}
.lib img{width:34px;height:34px;object-fit:contain}
.drop-mini{border:1px dashed var(--ui-line2);border-radius:8px;padding:10px;text-align:center;color:var(--ui-muted);font-size:12px;cursor:pointer}
.drop-mini:hover,.drop-mini.over{border-color:var(--ui-accent);color:var(--ui-text)}

/* fichiers */
.asset{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;padding:6px;border:1px solid var(--ui-line);border-radius:8px;margin:5px 0}
.asset .th{width:40px;height:40px;border-radius:6px;background:#14161A center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--ui-muted);font-size:10px;overflow:hidden}
.asset .p{font-family:var(--ui-mono);font-size:11px;word-break:break-all}
.asset .m{color:var(--ui-dim);font-size:11px}
.tag{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:99px;border:1px solid currentColor;margin-left:4px}

/* ---------- scène ---------- */
.stage{display:flex;flex-direction:column;min-width:0;background:radial-gradient(ellipse at 50% 42%, rgba(var(--ambient),.20), transparent 62%), var(--ui-bg);transition:background 1.2s}
.stagebar{display:flex;gap:6px;align-items:center;padding:10px 14px;flex-wrap:wrap;border-bottom:1px solid var(--ui-line)}
.stagebar .sp{flex:1}
.stagebar .lbl{color:var(--ui-dim);font-size:12px;margin-right:2px}
.tg{height:28px;padding:0 10px;border-radius:99px;border:1px solid var(--ui-line2);background:transparent;color:var(--ui-muted);font-size:12px}
.tg.on{border-color:var(--ui-accent);color:var(--ui-text);background:#FFB54718}
.viewport{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:26px 30px 10px}
.bezel{position:relative;padding:9px;background:#08090B;border-radius:14px;box-shadow:0 0 0 1px #2a2d33, 0 30px 80px -20px rgba(var(--ambient),.55), 0 0 140px -30px rgba(var(--ambient),.6);transition:box-shadow 1.2s}
.bezel:fullscreen{padding:0;border-radius:0;background:#000;display:flex;align-items:center;justify-content:center}
.screen{position:relative;overflow:hidden;border-radius:3px;background:#000}
.stand{width:120px;height:10px;margin:0 auto;background:linear-gradient(#0b0c0e,#17191d);border-radius:0 0 8px 8px}
.kbd{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);color:var(--ui-dim);font-size:11.5px;white-space:nowrap}
.kbd kbd{font:11px var(--ui-mono);border:1px solid var(--ui-line2);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--ui-muted)}
.issues{max-height:30%;overflow:auto;border-top:1px solid var(--ui-line);padding:8px 14px 10px;background:var(--ui-panel)}
.issues .h{display:flex;align-items:center;gap:10px;margin-bottom:4px;font-weight:600}
.issues .h .c{font-weight:400;color:var(--ui-muted);font-size:12px}
.issue{display:flex;gap:8px;align-items:baseline;padding:3px 6px;border-radius:5px;cursor:pointer;font-size:12.5px}
.issue:hover{background:#ffffff08}
.issue .d{width:7px;height:7px;border-radius:50%;flex:none;transform:translateY(-1px)}
.issue.error .d{background:var(--ui-err)} .issue.warn .d{background:var(--ui-warn)} .issue.info .d{background:var(--ui-info)}
.issue .s{color:var(--ui-dim);font-size:11.5px;margin-left:auto;white-space:nowrap}

/* glisser-déposer */
.dropzone{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:#0b0c0fcc;backdrop-filter:blur(4px)}
.dropzone.on{display:flex}
.dropzone div{border:2px dashed var(--ui-accent);border-radius:18px;padding:40px 60px;text-align:center;font-size:16px}
.dropzone small{display:block;color:var(--ui-muted);margin-top:8px;font-size:13px}
.toasts{position:fixed;right:16px;bottom:16px;z-index:120;display:flex;flex-direction:column;gap:8px;max-width:380px}
.toast{background:var(--ui-raised);border:1px solid var(--ui-line2);border-radius:10px;padding:10px 12px;box-shadow:0 10px 30px #0009;font-size:12.5px}
.toast .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.toast .x{float:right;border:0;background:none;color:var(--ui-dim);margin:-4px -4px 0 6px}
.modal{position:fixed;inset:0;z-index:110;background:#0009;display:none;align-items:center;justify-content:center}
.modal.on{display:flex}
.modal .box{width:min(560px,92vw);background:var(--ui-panel);border:1px solid var(--ui-line2);border-radius:12px;padding:18px}
.modal h2{margin:0 0 6px;font-size:16px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}

@media (max-width:1100px){.app{grid-template-columns:118px 340px 1fr}.f{grid-template-columns:96px 1fr 18px}}
@media (prefers-reduced-motion:reduce){.stage,.bezel{transition:none}}

/* =============== l'écran TV (unités = dp) =============== */
#tv{position:absolute;left:0;top:0;width:960px;height:540px;overflow:hidden;transform-origin:0 0;outline:none;
  --e-std:cubic-bezier(.2,0,0,1);--e-emp:cubic-bezier(.2,0,0,1);--d-fast:120ms;--d-base:240ms;--d-slow:420ms;--d-emp:300ms}
#tv *{box-sizing:border-box}
#tv .layer{position:absolute;inset:0}
#bgCanvas,#ovCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ovCanvas{pointer-events:none;z-index:40}
#bgImage{background-size:cover;background-position:center}
#bgMedia{background-size:cover;background-position:center;transform:scale(1.15)}
#decos{z-index:30;pointer-events:none}
#decos .dc{position:absolute;pointer-events:none}
#decos .dc img{width:100%;height:100%;display:block}
#decos .dc.hl{outline:1.5px dashed #FFB547;outline-offset:2px}
.home{position:absolute;inset:0;z-index:10}
.home.anim-out{pointer-events:none}

.framed{position:absolute}
.framed>.fr{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:1}
.framed>.fg{position:absolute;inset:0;z-index:0}
.framed>.fc{position:relative;z-index:2;height:100%}
.fx{transition:transform var(--d-emp) var(--e-emp), filter var(--d-base) var(--e-std)}

.tb{position:absolute;left:32px;right:32px;top:14px;height:72px;display:flex;align-items:center;gap:14px}
.clockblock{flex:1;min-width:0}
.clockrow{display:flex;align-items:baseline;gap:14px;white-space:nowrap}
.tabs,.chipsrow{display:flex;gap:8px;align-items:center}
.pillw{position:relative;height:30px}
.pillw .fc{display:flex;align-items:center;justify-content:center;padding:0 14px;white-space:nowrap}
.chipsrow .pillw .fc{gap:6px}
.chipsrow svg{width:14px;height:14px}

.nuvio{left:32px;right:32px;top:94px;height:236px;transition:height var(--d-slow) var(--e-std), top var(--d-slow) var(--e-std)}
.nuvio>.fc{display:flex;flex-direction:column;padding:12px 16px 14px}
.nhead{display:flex;align-items:baseline;gap:12px;min-height:18px;white-space:nowrap;overflow:hidden}
.nhead .t-hero{overflow:hidden;text-overflow:ellipsis}
.cards{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:8px;min-height:0}
.cardslot{position:relative}
.card{position:absolute;inset:0}
.card>.fc{display:flex;flex-direction:column;overflow:hidden}
.card .art{position:relative;flex:1;min-height:0;background-size:cover;background-position:center}
.card .badge{position:absolute;left:10px;top:10px;padding:2px 8px;border-radius:99px;font:600 10px/1.5 var(--f-body);letter-spacing:.6px;text-transform:uppercase}
.card .info{padding:7px 12px 9px;display:flex;flex-direction:column;gap:1px}
.card .info .t-cardTitle,.card .info .t-cardMeta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{position:relative;overflow:hidden;margin-top:5px}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:inherit}
.tv-mini .card>.fc{flex-direction:row}
.tv-mini .card .art{flex:0 0 38%;height:100%}
.tv-mini .card .info{flex:1;justify-content:center;min-width:0}

.strips{position:absolute;left:32px;right:32px;top:340px;height:84px;display:grid;grid-template-columns:1fr 1fr;gap:16px;transition:top var(--d-slow) var(--e-std),height var(--d-slow) var(--e-std)}
.stripw{position:relative}
.strip{position:absolute;inset:0}
.strip>.fc{display:flex;align-items:center;gap:12px;padding:9px 14px}
.strip .sart{width:54px;height:54px;border-radius:8px;flex:none;background-size:cover;background-position:center;transition:width var(--d-slow),height var(--d-slow)}
.strip .sinfo{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;overflow:hidden;max-height:100%}
.strip .sinfo>*{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock{position:absolute;left:32px;right:32px;top:436px;height:80px;display:flex;gap:12px;align-items:center;transition:top var(--d-slow) var(--e-std)}
.tilew{position:relative;width:72px;height:72px;flex:none}
.tilew.all{width:150px}
.tile{position:absolute;inset:0}
.tile>.fc{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;text-align:center}
.tile .ico{width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.tile .ico svg,.tile .ico img{width:100%;height:100%;display:block}
.tile .orig{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:700 18px/1 system-ui;color:#fff;box-shadow:inset 0 0 0 1px #ffffff30}
.tile .lt{font-weight:700;font-size:28px}

.tv-cinema.nfocus .nuvio{top:94px;height:300px}
.tv-cinema.nfocus .strips{top:404px;height:40px}
.tv-cinema.nfocus .strip .sart{width:24px;height:24px}
.tv-cinema.nfocus .strip .t-body,.tv-cinema.nfocus .strip .t-caption,.tv-cinema.nfocus .strip .prog{display:none}
.tv-cinema.nfocus .strip>.fc{padding-top:4px!important;padding-bottom:4px!important}
.tv-cinema.nfocus .dock{top:454px}
.tv-eco .fx{transition:none}

</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="led"></span>Atelier de thèmes TV</div>
  <div class="name" id="themeName"></div>
  <div class="grow"></div>
  <button class="btn ghost icon" id="undoBtn" title="Annuler (Ctrl+Z)" aria-label="Annuler">↶</button>
  <button class="btn ghost icon" id="redoBtn" title="Rétablir (Ctrl+Y)" aria-label="Rétablir">↷</button>
  <div class="menu">
    <button class="btn" id="newBtn">Nouveau ▾</button>
    <div class="menu-pop" id="newMenu"></div>
  </div>
  <button class="btn" id="openBtn">Ouvrir un thème ou des fichiers</button>
  <div class="menu">
    <button class="btn primary" id="exportBtn">Exporter ▾</button>
    <div class="menu-pop" id="exportMenu">
      <button data-exp="zip">Fichier .tvtheme<small>theme.json + tous les fichiers utilisés</small></button>
      <button data-exp="json">theme.json seul<small>Les fichiers assets/ ne sont pas inclus</small></button>
      <button data-exp="copy">Copier le JSON<small>À coller depuis la page de transfert</small></button>
    </div>
  </div>
</header>

<div class="app">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <section class="panel" id="panel"></section>
  <main class="stage">
    <div class="stagebar">
      <span class="lbl">Accueil</span>
      <button class="tg" id="tgMini" title="Mode miniatures de l'accueil">Miniatures</button>
      <button class="tg" id="tgCinema" title="Le bloc Nuvio s'agrandit quand il est sélectionné">Cinéma</button>
      <button class="tg" id="tgEco" title="Mode économie : fond animé, lueurs, animations et musique coupés">Économie</button>
      <span class="sp"></span>
      <button class="btn small" id="testPage">Tester la transition de page</button>
      <button class="btn small" id="testCarousel">Changer de profil</button>
      <button class="btn small" id="musicBtn" title="Écouter la musique du thème">♪ Musique</button>
      <button class="btn small icon" id="fsBtn" title="Plein écran" aria-label="Plein écran">⛶</button>
    </div>
    <div class="viewport" id="viewport">
      <div>
        <div class="bezel" id="bezel"><div class="screen" id="screen">
          <div id="tv" tabindex="0" aria-label="Aperçu de l'accueil, utilisez les flèches">
            <div class="layer" id="bgLayer">
              <div class="layer" id="bgSolid"></div>
              <div class="layer" id="bgImage"></div>
              <div class="layer" id="bgMedia"></div>
              <canvas id="bgCanvas"></canvas>
              <div class="layer" id="bgOverlay"></div>
            </div>
            <div class="home" id="home"></div>
            <div class="layer" id="decos"></div>
            <canvas id="ovCanvas"></canvas>
          </div>
        </div></div>
        <div class="stand"></div>
      </div>
      <div class="kbd">Cliquez sur l'écran puis <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> pour naviguer, <kbd>Entrée</kbd> pour valider, <kbd>Échap</kbd> pour retour</div>
    </div>
    <div class="issues" id="issues"></div>
  </main>
</div>

<div class="dropzone" id="dropzone"><div>Déposez vos fichiers<small>.tvtheme, theme.json, images, sons, musiques, polices, SVG, shaders .agsl</small></div></div>
<div class="toasts" id="toasts"></div>

function collectIssues() {
  const t = S.theme, out = [];
  const add = (lvl, msg, sec) => out.push({ lvl, msg, sec });
  const m = t.meta || {};
  if (!m.id) add('error', 'meta.id est obligatoire.', 'general');
  else if (!/^[a-z0-9-]+$/.test(m.id)) add('error', `meta.id « ${m.id} » : uniquement minuscules, chiffres et tirets.`, 'general');
  if (!m.name) add('error', 'meta.name est obligatoire.', 'general');
  for (const k of Object.keys(t)) if (!HANDLED_TOP.includes(k)) add('info', `La section « ${k} » est ignorée par le launcher 1.0.`, 'json');
  // couleurs
  for (const [k, v] of Object.entries(t.colors || {})) if (v != null && !resolveColor(v)) add('error', `Couleur « ${k} » illisible : ${v}`, 'colors');
  const bg = resolveColor(themeColor('background')) || { r: 0, g: 0, b: 0, a: 1 };
  const glass = resolveColor(t.glass?.tint ?? '{colors.surfaceGlass}');
  const tx = resolveColor('{colors.text}'), mu = resolveColor('{colors.textMuted}'), ac = resolveColor('{colors.accent}'), oa = resolveColor('{colors.textOnAccent}');
  if (glass && tx) { const surf = over(glass, bg); const c = contrast(over(tx, surf), surf); if (c < 4.5) add('warn', `Contraste texte / verre faible : ${c.toFixed(1)}:1 (viser 4,5 pour lire à 3 m).`, 'colors'); }
  if (glass && mu) { const surf = over(glass, bg); const c = contrast(over(mu, surf), surf); if (c < 3) add('warn', `Texte secondaire peu lisible sur le verre : ${c.toFixed(1)}:1.`, 'colors'); }
  if (ac && oa) { const c = contrast(over(oa, over(ac, bg)), over(ac, bg)); if (c < 4.5) add('warn', `Contraste texte sur accent faible : ${c.toFixed(1)}:1.`, 'colors'); }
  // typo
  const st = t.typography?.styles || {};
  for (const k of STYLE_KEYS) if (st[k]?.size > STYLE_MAX[k]) add('warn', `${STYLE_NAMES[k]} : taille ${st[k].size} plafonnée à ${STYLE_MAX[k]}.`, 'type');
  for (const [k, v] of Object.entries(t.typography?.fonts || {})) {
    if (v === 'builtin:rounded') add('info', `Police « ${k} » : builtin:rounded s'affiche comme builtin:sans.`, 'type');
    else if (typeof v === 'string' && v.startsWith('assets/') && !S.assets.has(v)) add('error', `Police manquante : ${v}`, 'files');
  }
  if (t.shape?.cornerStyle === 'squircle') add('info', 'cornerStyle « squircle » n\'est pas géré (arrondi utilisé).', 'shape');
  const b = t.background || {};
  if (b.type === 'video') add('warn', 'Le fond vidéo n\'est pas géré : le repli sera utilisé.', 'background');
  if ((b.type === 'shader' || b.type === 'video') && !b.fallback) add('warn', 'Pas de background.fallback : prévoyez un dégradé ou une couleur pour le mode économie.', 'background');
  if (b.type === 'image' && !b.image) add('error', 'Fond « image » sans image.', 'background');
  if (b.parallax != null) add('info', 'background.parallax n\'est pas géré.', 'background');
  if (b.type === 'shader') {
    if (!b.shader?.agsl) add('error', 'Fond « shader » sans code AGSL.', 'background');
    else {
      if (SHADER.bg.error) add('error', 'Shader de fond : ' + SHADER.bg.error.split('\n')[0], 'background');
      for (const n of loopWarnings(b.shader.agsl)) add('warn', `Shader de fond : boucle de ${n} itérations (8 max conseillé sur le boîtier).`, 'background');
    }
  }
  const so = t.shaders?.screenOverlay;
  if (so?.agsl) {
    if (SHADER.ov.error) add('error', 'Effet d\'écran : ' + SHADER.ov.error.split('\n')[0], 'overlay');
    for (const n of loopWarnings(so.agsl)) add('warn', `Effet d'écran : boucle de ${n} itérations (8 max conseillé).`, 'overlay');
  }
  for (const k of ['cardImage', 'focusEnter', 'pageTransition']) if (t.shaders?.[k]) add('info', `shaders.${k} n'est pas géré.`, 'overlay');
  const mo = t.motion || {};
  if (['flip', 'zoomBlur'].includes(mo.pageTransition)) add('info', `Transition « ${mo.pageTransition} » : affichée comme « scale ».`, 'motion');
  if (mo.carouselTransition === 'cascade') add('info', 'Transition « cascade » non gérée.', 'motion');
  for (const k of ['standard', 'emphasized']) if (mo.easing?.[k] && easingCss(mo.easing[k]).bad) add('error', `Easing « ${k} » illisible : ${mo.easing[k]}`, 'motion');
  if (t.components?.nuvioBadge === 'dot') add('info', 'nuvioBadge « dot » n\'est pas géré.', 'motion');
  // décorations
  const decos = Array.isArray(t.decorations) ? t.decorations : [];
  if (decos.length > 40) add('error', `${decos.length} décorations : 40 maximum, les suivantes seront ignorées.`, 'decos');
  const anim = decos.filter(d => d?.animation?.type && d.animation.type !== 'none').length;
  if (anim > 10) add('warn', `${anim} décorations animées : au-delà d'une dizaine, le boîtier peut ralentir.`, 'decos');
  decos.forEach((d, i) => {
    const [an, ed] = String(d?.anchor || '').split('.');
    if (!ANCHORS.includes(an) || (ed && !EDGES.includes(ed))) add('error', `Décoration ${i + 1} : ancre « ${d?.anchor} » inconnue.`, 'decos');
    if (d?.content?.lottie) add('info', `Décoration ${i + 1} : contenu Lottie non géré.`, 'decos');
  });
  // fichiers
  const refs = referencedAssets();
  for (const p of refs) if (!S.assets.has(p)) add('error', `Fichier manquant : ${p}`, 'files');
  for (const [p, a] of S.assets) {
    if (a.meta.w > 3840 || a.meta.h > 2160) add('warn', `${p} : ${a.meta.w}×${a.meta.h}, sera réduite (3840×2160 max).`, 'files');
    if (p.startsWith('assets/sounds/') && a.meta.duration > 1.05 && refs.has(p)) add('warn', `${p} dure ${a.meta.duration.toFixed(1)} s (sons d'interface < 1 s).`, 'sounds');
    if (kindOf(p) === 'audio' && a.size > 15 * 1048576) add('error', `${p} dépasse 15 Mo.`, 'music');
  }
  if ((t.music?.tracks || []).length > 10) add('error', 'Plus de 10 pistes de musique.', 'music');
  const json = exportJsonText();
  if (json.length > 1048576) add('error', `theme.json pèse ${fmtBytes(json.length)} (1 Mo max).`, 'json');
  let total = json.length; for (const p of refs) total += S.assets.get(p)?.size || 0;
  if (total > 80 * 1048576) add('error', `Le .tvtheme pèserait ${fmtBytes(total)} (80 Mo max).`, 'files');
  if (/(?<!\\)"https?:\/\//.test(json)) add('info', 'Le thème contient des liens https : le launcher les télécharge une fois.', 'files');
  for (const k of ['effects', 'boot']) if (t[k]) add('info', `« ${k} » n'est pas géré pour l'instant.`, 'json');
  if (t.icons?.ui || t.icons?.style) add('info', 'icons.ui et icons.style ne sont pas encore gérés.', 'icons');
  if (t.glass && ['blur', 'realtime', 'grain', 'saturation'].some(k => k in t.glass)) add('info', 'glass : seuls enabled, tint et highlight sont gérés.', 'shape');
  if (t.focus && ['dimOthers', 'shine', 'animation'].some(k => k in t.focus)) add('info', 'focus : dimOthers, shine et animation ne sont pas gérés.', 'motion');
  return out;
}

/* ================= palette depuis une image ================= */
function paletteFromImage(path) {
  const a = S.assets.get(path); if (!a) return;
  const im = new Image();

    const cv = document.createElement('canvas'); const W = 64, H = Math.max(1, Math.round(64 * im.naturalHeight / im.naturalWidth));

    for (let it = 0; it < 8; it++) {
      const acc = cent.map(() => [0, 0, 0, 0]);
      for (const p of px) { let bi = 0, bd = 1e9; cent.forEach((c, i) => { const dd = (p[0] - c[0]) ** 2 + (p[1] - c[1]) ** 2 + (p[2] - c[2]) ** 2; if (dd < bd) { bd = dd; bi = i; } }); const A = acc[bi]; A[0] += p[0]; A[1] += p[1]; A[2] += p[2]; A[3]++; }
      cent = acc.map((A, i) => A[3] ? [A[0] / A[3], A[1] / A[3], A[2] / A[3], A[3]] : [...cent[i].slice(0, 3), 0]);
    }

    const vivid = [...cent].filter(c => c[3] > 0).sort((a, b) => sat(b) * (0.4 + L(b)) - sat(a) * (0.4 + L(a)))[0];

    const ink = dark ? mix(byLum.at(-1), [255, 255, 255], .85) : mix(byLum[0], [0, 0, 0], .75);

    const accC = toC(acc), onDark = contrast(accC, { r: 10, g: 10, b: 10, a: 1 }), onLight = contrast(accC, { r: 250, g: 250, b: 250, a: 1 });
    const cols = {
      background: hex(base), surface: hex(dark ? mix(base, ink, .07) : mix(base, ink, .04)), surfaceGlass: hex(dark ? mix(base, ink, .08) : mix(base, [255, 255, 255], .5), dark ? 0.72 : 0.85),
      surfaceRaised: hex(ink, dark ? 0.1 : 0.08), text: hex(ink), textMuted: hex(mix(ink, base, .38)), accent: hex(acc),
      textOnAccent: onDark > onLight ? '#0B0B0D' : '#FFFFFF', focusRing: dark ? hex(mix(acc, [255, 255, 255], .5)) : hex(mix(acc, [0, 0, 0], .3)),
      progressTrack: hex(ink, 0.18), progressFill: '{colors.accent}', badge: hex(acc, 0.9), badgeText: '{colors.textOnAccent}'
    };
    S.theme.colors = { ...(S.theme.colors || {}), ...cols };
    commit({ panel: true }); toast('Palette créée à partir de l\'image. Annuler avec Ctrl+Z si elle ne convient pas.');
  };
  im.src = a.url;
}

/* ---------- Fichiers ---------- */
function secFiles(p) {
  const refs = referencedAssets();
  const total = [...S.assets.values()].reduce((s, a) => s + a.size, 0);
  p.append(h('h2', {}, 'Fichiers'), h('p', { class: 'lead' }, `Contenu du dossier assets/ : ${S.assets.size} fichier${S.assets.size > 1 ? 's' : ''}, ${fmtBytes(total)}. Seuls les fichiers utilisés partent dans l'export.`));
  p.append(h('div', { class: 'drop-mini', onclick: () => pickFiles([], fs => handleFiles(fs)) }, 'Ajouter des fichiers (ou glissez-les dans la fenêtre)'));
  const unused = [...S.assets.keys()].filter(k => !refs.has(k));
  if (unused.length) p.append(h('button', { class: 'btn small', style: { marginTop: '8px' }, onclick: () => { unused.forEach(removeAsset); commit({ panel: true }); } }, `Supprimer les ${unused.length} fichier${unused.length > 1 ? 's' : ''} non utilisé${unused.length > 1 ? 's' : ''}`));
  const missing = [...refs].filter(r => !S.assets.has(r));
  if (missing.length) { p.append(sub('Manquants', 'cités par le thème')); for (const m of missing) p.append(h('div', { class: 'asset' }, h('div', { class: 'th' }, '?'), h('div', {}, h('div', { class: 'p' }, m), h('div', { class: 'm', style: { color: 'var(--ui-err)' } }, 'Fichier introuvable')), h('button', { class: 'btn small', onclick: () => pickFiles([kindOf(m)], fs => { if (fs[0]) { addAsset(m, fs[0], { replace: true }); commit({ panel: true }); } }) }, 'Fournir'))); }
  const groups = [['Images', ['image']], ['SVG', ['svg']], ['Sons et musiques', ['audio']], ['Polices', ['font']], ['Autres', ['video', 'shader', 'json', 'other']]];
  for (const [title, kinds] of groups) {
    const list = assetsOfKind(...kinds); if (!list.length) continue;
    p.append(sub(title));
    for (const path of list) {
      const a = S.assets.get(path), k = kindOf(path), used = refs.has(path);
      const th = h('div', { class: 'th', style: (k === 'image' || k === 'svg') ? { backgroundImage: `url("${a.url}")` } : {} }, k === 'audio' ? '♪' : k === 'font' ? 'Aa' : (k === 'image' || k === 'svg') ? '' : extOf(path));
      if (k === 'font') th.style.fontFamily = `"${ensureFontFace(path)}"`;
      const info = [fmtBytes(a.size)]; if (a.meta.w) info.push(`${a.meta.w}×${a.meta.h}`); if (a.meta.duration) info.push(a.meta.duration.toFixed(1) + ' s');
      const name = h('div', { class: 'p', title: 'Cliquer pour renommer', style: { cursor: 'text' } }, path);
      name.onclick = () => { const i = h('input', { class: 'inp', value: path }); name.replaceWith(i); i.focus(); i.select(); const done = () => { if (i.value.trim() !== path && !renameAsset(path, i.value)) toast('Ce nom est déjà pris.'); commit({ panel: true }); }; i.onblur = done; i.onkeydown = e => { if (e.key === 'Enter') i.blur(); if (e.key === 'Escape') { i.value = path; i.blur(); } }; };
      p.append(h('div', { class: 'asset' }, th, h('div', {}, name, h('div', { class: 'm' }, info.join(' · '), h('span', { class: 'tag', style: { color: used ? 'var(--ui-ok)' : 'var(--ui-dim)' } }, used ? 'utilisé' : 'non utilisé'))),
        h('div', { class: 'row' }, k === 'audio' ? h('button', { class: 'btn small icon', title: 'Écouter', onclick: () => playResource(path, 0.7) }, '▶') : null,
          h('button', { class: 'btn small icon', title: 'Supprimer', onclick: () => { removeAsset(path); commit({ panel: true }); } }, '×'))));
    }
  }
}

      shaders: { screenOverlay: { agsl: OV_SHADERS[0].code, opacity: 0.35 } },

function applyPreset(pr) {
  const go = () => { S.theme = pr.theme(); S.idTouched = false; afterThemeReplaced(); histPush(); toast(`Thème « ${pr.name} » chargé.`); };
  const pristine = JSON.stringify(S.theme) === JSON.stringify(blankTheme());
  if (pristine) go();
  else modal(`Charger « ${pr.name} » ?`, h('p', { class: 'note' }, 'Le thème affiché sera remplacé. Vous pourrez revenir en arrière avec Ctrl+Z, et les fichiers déposés restent disponibles.'), [['Annuler', () => {}], ['Charger', go, true]]);
}

/* ================= démarrage et événements ================= */
function afterThemeReplaced() {
  if (!isObj(S.theme)) S.theme = blankTheme();
  S.selDeco = -1; ART_CACHE.clear();
  renderRail(); renderPanel(); scheduleRender(); saveTheme(); updateUndoButtons();
}
function syncModeButtons() {
  $('#tgMini').classList.toggle('on', S.modes.mini); $('#tgCinema').classList.toggle('on', S.modes.cinema); $('#tgEco').classList.toggle('on', S.modes.eco);
  if (S.modes.eco && AUDIO.playing) musicStop();
}
function fillColorRefs() {
  const dl = $('#colorRefs'); dl.innerHTML = '';
  const refs = [...COLOR_KEYS.map(([k]) => `{colors.${k}}`), '{media.dominant}', '{media.vibrant}', '{media.muted}', '{profile.color}', '{item.accent}', '{item.accent}@50', '{colors.accent}@40', '{colors.text}@60'];
  refs.forEach(r => dl.append(h('option', { value: r })));
}
function buildNewMenu() {
  const m = $('#newMenu'); m.innerHTML = '';
  for (const pr of PRESETS) m.append(h('button', { onclick: () => { closeMenus(); applyPreset(pr); } }, pr.name, h('small', {}, { 'Vierge': 'Les valeurs par défaut du launcher', 'Verre sombre': 'Panneaux en verre, dégradé nuit', 'Collines au vent': 'Ciel peint animé, papier crème', 'Néon 2077': 'Coins coupés, néons, encoches, balayage', 'Synthwave': 'Grille et soleil rétro animés', 'Clair minimal': 'Fond clair, contraste fort', 'Aurore': 'Aurore boréale animée, neige' }[pr.name] || '')));
  m.append(h('hr'), h('button', { onclick: () => { closeMenus(); modal('Tout effacer ?', h('p', { class: 'note' }, 'Le thème et tous les fichiers déposés seront supprimés de ce navigateur.'), [['Annuler', () => {}], ['Tout effacer', () => { for (const k of [...S.assets.keys()]) removeAsset(k); DB.clear(); S.theme = blankTheme(); S.idTouched = false; afterThemeReplaced(); histPush(); }, true]]); } }, 'Tout effacer', h('small', {}, 'Thème et fichiers')));
}
function closeMenus() { $$('.menu-pop').forEach(m => m.classList.remove('open')); }
function bindUi() {
  $('#newBtn').onclick = e => { e.stopPropagation(); const o = $('#newMenu').classList.contains('open'); closeMenus(); if (!o) $('#newMenu').classList.add('open'); };
  $('#exportBtn').onclick = e => { e.stopPropagation(); const o = $('#exportMenu').classList.contains('open'); closeMenus(); if (!o) $('#exportMenu').classList.add('open'); };
  document.addEventListener('click', e => { if (!e.target.closest('.menu')) closeMenus(); });
  $$('#exportMenu button').forEach(b => b.onclick = () => { closeMenus(); ({ zip: exportZip, json: exportJsonFile, copy: copyJson })[b.dataset.exp](); });
  $('#openBtn').onclick = () => $('#fileIn').click();
  $('#fileIn').onchange = () => { handleFiles($('#fileIn').files); $('#fileIn').value = ''; };
  $('#undoBtn').onclick = () => histGo(-1); $('#redoBtn').onclick = () => histGo(1);
  $('#tgMini').onclick = () => { S.modes.mini = !S.modes.mini; syncModeButtons(); scheduleRender(); saveTheme(); };
  $('#tgCinema').onclick = () => { S.modes.cinema = !S.modes.cinema; syncModeButtons(); scheduleRender(); saveTheme(); if (S.modes.cinema && !/^card/.test(S.focusId)) toast('Mode cinéma : sélectionnez une carte Nuvio pour voir le bloc s\'agrandir.'); };
  $('#tgEco').onclick = () => { S.modes.eco = !S.modes.eco; syncModeButtons(); scheduleRender(); renderPanelIf('background'); saveTheme(); };
  $('#testPage').onclick = testPageTransition;
  $('#testCarousel').onclick = () => switchProfile((S.profile + 1) % PROFILES.length);
  $('#musicBtn').onclick = musicToggle;
  $('#fsBtn').onclick = () => { const b = $('#bezel'); document.fullscreenElement ? document.exitFullscreen() : b.requestFullscreen?.(); };
  document.addEventListener('fullscreenchange', () => setTimeout(() => { fitTv(); scheduleRender(); }, 60));
  const tv = $('#tv');
  tv.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'ArrowLeft') moveFocus(-1, 0); else if (k === 'ArrowRight') moveFocus(1, 0);
    else if (k === 'ArrowUp') moveFocus(0, -1); else if (k === 'ArrowDown') moveFocus(0, 1);
    else if (k === 'Enter' || k === ' ') pressFocused();
    else if (k === 'Escape' || k === 'Backspace') playSound('back');
    else return;
    e.preventDefault();
  });
  tv.addEventListener('click', e => { actx(); tv.focus(); const f = e.target.closest('.framed[data-fid]'); if (f) { if (f.dataset.fid === S.focusId) pressFocused(); else setFocus(f.dataset.fid); } });
  // raccourcis
  document.addEventListener('keydown', e => {
    const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
    if ((e.ctrlKey || e.metaKey) && !inField) {
      if (e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); histGo(-1); }
      else if (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey)) { e.preventDefault(); histGo(1); }
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); exportZip(); }
    if (e.key === 'Escape') { closeMenus(); $('#modal').classList.remove('on'); }
  });
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') $('#modal').classList.remove('on'); });
  // glisser-déposer partout
  let depth = 0;
  addEventListener('dragenter', e => { if (![...(e.dataTransfer?.types || [])].includes('Files')) return; depth++; $('#dropzone').classList.add('on'); e.preventDefault(); });
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (!depth) $('#dropzone').classList.remove('on'); });
  addEventListener('drop', e => { e.preventDefault(); depth = 0; $('#dropzone').classList.remove('on'); if (e.dataTransfer?.files?.length) { actx(); handleFiles(e.dataTransfer.files); } });
  new ResizeObserver(() => { fitTv(); scheduleRender(); }).observe($('#viewport'));
  setInterval(updateClock, 15000);
  addEventListener('pointerdown', () => actx(), { once: true });
}
async function init() {
  SHADER.bg = new ShaderLayer($('#bgCanvas'), false);
  SHADER.ov = new ShaderLayer($('#ovCanvas'), true);
  fillColorRefs(); buildNewMenu(); bindUi();
  await DB.open();
  for (const [p, blob] of await DB.all()) {
    const a = { blob, url: URL.createObjectURL(blob), size: blob.size, meta: {} };
    S.assets.set(p, a); probeAsset(p, a);
  }
  try {
    const t = JSON.parse(localStorage.getItem('tvtheme-studio:theme') || 'null');
    const ui = JSON.parse(localStorage.getItem('tvtheme-studio:ui') || 'null');
    if (isObj(t)) S.theme = t;
    if (ui) { S.section = ui.section || S.section; Object.assign(S.modes, ui.modes || {}); }
  } catch {}
  if (!S.theme) S.theme = blankTheme();
  S.idTouched = !!S.theme.meta?.id && S.theme.meta.id !== 'mon-theme';
  syncModeButtons(); renderRail(); renderPanel(); fitTv(); renderPreview(); histPush(); updateUndoButtons();
  requestAnimationFrame(decoTick);
  window.__ready = true;
}
init();
